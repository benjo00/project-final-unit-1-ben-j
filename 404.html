<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
  </head>
  <body>
    <p>Redirecting...</p>
    <script>
      const redirectTo = location.pathname.replace(/\/+$/, '');
        // this should redirect the 404 error back to my page and prevent crashing
      window.location.replace('/project-final-unit-1-ben-j/?redirect=' + encodeURIComponent(redirectTo));
    </script>
  </body>
</html>
